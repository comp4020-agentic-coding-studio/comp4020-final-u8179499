<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Message in a Bottle</title>
    <style>
      :root {
        /* dusk sky: near-black zenith down through indigo and violet to a
           thin warm afterglow band right at the horizon */
        --sky-zenith: #080a18;
        --sky-upper: #161a3a;
        --sky-mid: #35305f;
        --sky-horizon: #7a5d78;
        --sky-glow: #e8a06a;

        /* night sea: a lit surface sinking into midnight depth */
        --sea-surface: #1f5560;
        --sea-mid: #123244;
        --sea-deep: #050b16;

        --moon: #f4efe0;
        --moon-glow: rgba(244, 239, 224, 0.55);
        --moon-left: 74%;

        --amber: #f0a868;
        --amber-soft: rgba(240, 168, 104, 0.4);
        --cool: #9bdcee;
        --cool-soft: rgba(155, 220, 238, 0.4);

        --ink: #f1ecf2;
        --ink-dim: #c7c2dc;
        --control-dim: #9b95b4;
        --status: #e8bb85;

        --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
        --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        font-family: var(--serif);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        background: var(--sky-zenith);
        overflow-x: hidden;
      }

      /* --- the scene: dusk sky, moon, horizon glow, sea, horizon --- */

      .scene {
        position: fixed;
        inset: 0;
        overflow: hidden;
        z-index: -1;
      }

      .sky {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 55%;
        background: linear-gradient(
          to bottom,
          var(--sky-zenith) 0%,
          var(--sky-upper) 38%,
          var(--sky-mid) 68%,
          var(--sky-horizon) 92%,
          var(--sky-glow) 100%
        );
      }

      .moon {
        position: absolute;
        top: 11%;
        left: var(--moon-left);
        width: 58px;
        height: 58px;
        transform: translateX(-50%);
        border-radius: 50%;
        background: radial-gradient(circle at 42% 40%, #fffaf0 0%, var(--moon) 55%, #e4dcc4 100%);
        box-shadow:
          0 0 18px 6px var(--moon-glow),
          0 0 64px 26px rgba(244, 239, 224, 0.18),
          0 0 130px 60px rgba(180, 190, 230, 0.08);
        filter: blur(0.5px);
      }

      /* the sliver of light the moon lays across the water — subtle,
         tapering, the clearest "environment, not decoration" cue */
      .moon-path {
        position: absolute;
        top: 55%;
        left: var(--moon-left);
        width: 18%;
        height: 45%;
        transform: translateX(-50%);
        background: linear-gradient(
          to bottom,
          rgba(244, 239, 224, 0.32) 0%,
          rgba(244, 239, 224, 0.12) 45%,
          rgba(244, 239, 224, 0) 100%
        );
        clip-path: polygon(46% 0%, 54% 0%, 100% 100%, 0% 100%);
        mix-blend-mode: screen;
        filter: blur(2px);
        animation: moon-path-shimmer 7s ease-in-out infinite;
      }

      @keyframes moon-path-shimmer {
        0%, 100% { opacity: 0.75; }
        50% { opacity: 1; }
      }

      /* the warm afterglow where sky meets water, blurred into both */
      .horizon-glow {
        position: absolute;
        top: 52%;
        left: 0;
        right: 0;
        height: 10%;
        background: radial-gradient(
          ellipse 60% 100% at 50% 50%,
          rgba(232, 160, 106, 0.22) 0%,
          rgba(232, 160, 106, 0.08) 45%,
          transparent 80%
        );
        filter: blur(6px);
        pointer-events: none;
      }

      .sea {
        position: absolute;
        top: 55%;
        left: 0;
        right: 0;
        bottom: 0;
        overflow: hidden;
        background: linear-gradient(to bottom, var(--sea-surface) 0%, var(--sea-mid) 40%, var(--sea-deep) 100%);
      }

      /* a thin restrained mist resting on the water, ahead of the nearest
         wave mass — depth, not fog */
      .mist {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 60%;
        background: linear-gradient(to bottom, rgba(210, 225, 235, 0.1), transparent);
        opacity: 0.55;
        pointer-events: none;
      }

      /* Crit 9: a brief, content-free reaction of the sea itself — the only
         perceptible trace that a Throw or Catch happened somewhere,
         anonymous and identical for every viewer, including the one whose
         own action caused it. No count, no label, no position tied to any
         bottle. Thrown and caught get distinct but equally subtle
         treatments — a warm bloom spreading from the horizon vs. a cool
         glow drawing inward toward it — since the ADR allows the action
         type itself to be visible. The ::after bloom shares the same
         trigger class as the base filter animation, so JS needs no changes:
         removing+re-adding the class (with the forced reflow already in
         pulseOcean()) restarts both together. */
      @keyframes ocean-pulse-thrown {
        0% {
          filter: brightness(1) saturate(1);
        }
        30% {
          filter: brightness(1.14) saturate(1.1);
        }
        100% {
          filter: brightness(1) saturate(1);
        }
      }

      @keyframes ocean-pulse-caught {
        0% {
          filter: brightness(1) saturate(1);
        }
        35% {
          filter: brightness(0.92) saturate(0.94);
        }
        100% {
          filter: brightness(1) saturate(1);
        }
      }

      .sea.realtime-pulse-thrown {
        animation: ocean-pulse-thrown 900ms ease-out;
      }

      .sea.realtime-pulse-caught {
        animation: ocean-pulse-caught 900ms ease-in-out;
      }

      /* static gradients, animated only on opacity/transform — interpolating
         between two different gradients has inconsistent browser support,
         so the gradient itself never changes mid-animation */
      .sea::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        transform-origin: 50% 0%;
      }

      .sea.realtime-pulse-thrown::after {
        background: radial-gradient(ellipse 90% 70% at 50% 0%, var(--amber-soft), transparent 72%);
        animation: bloom-thrown 900ms ease-out;
      }

      .sea.realtime-pulse-caught::after {
        background: radial-gradient(ellipse 90% 70% at 50% 0%, var(--cool-soft), transparent 72%);
        animation: bloom-caught 900ms ease-in-out;
      }

      @keyframes bloom-thrown {
        0% {
          opacity: 0;
          transform: scale(0.75);
        }
        28% {
          opacity: 1;
          transform: scale(1);
        }
        100% {
          opacity: 0;
          transform: scale(1.3);
        }
      }

      @keyframes bloom-caught {
        0% {
          opacity: 0;
          transform: scale(1.3);
        }
        32% {
          opacity: 0.9;
          transform: scale(1);
        }
        100% {
          opacity: 0;
          transform: scale(0.75);
        }
      }

      /* the two ocean canvases (see initOcean() in the script at the end of
         this file): #ocean-back paints every layer except the nearest one;
         #ocean-front
         paints only the nearest layer, transparent everywhere else, on top
         of the DOM layer below. Whatever bottle happens to sit in the DOM
         between them gets covered by the real, organically-shaped nearest
         wave wherever it actually overlaps it — no per-element lip/mask. */
      .ocean-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      #ocean-back {
        z-index: 0;
      }

      #ocean-front {
        z-index: 2;
        pointer-events: none;
      }

      /* atmospheric only: never interactive, never a claim about a specific
         database row. outer: travels across the sea; inner: tiny bob; svg:
         tilt + rock. Six lanes (db-1..db-6) exist; which ones carry the
         `.active` class is decided in JS by setAmbientLevel(), driven by
         GET /api/ocean's visualLevel (decisions/0002) — 0-3 uncaught
         messages activates exactly that many lanes, 4+ randomly varies which
         2-4 lanes are active over time. A lane's own drift/bob/rock
         animation keeps running whether or not it's active, so reactivating
         one resumes it mid-cycle instead of resetting its position. */
      .drift-outer {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 0;
        pointer-events: none;
        visibility: hidden;
        opacity: 0;
        z-index: 1;
        transition: opacity 0.8s ease, visibility 0.8s;
      }

      .drift-outer.active {
        visibility: visible;
        opacity: 1;
      }

      .drift-inner {
        position: absolute;
        left: 0;
        animation: bottle-bob 3s ease-in-out infinite;
      }

      /* .bottle-box carries the per-lane size/position/rock animation (set
         per db-N below); the svg and the tint overlay inside it both fill it
         at 100%/100%, so they always line up with each other exactly. */
      .drift-inner .bottle-box {
        position: absolute;
        top: 0;
        left: 0;
      }

      .drift-inner .bottle-box svg {
        display: block;
        width: 100%;
        height: 100%;
        transform-origin: 50% 50%;
      }

      .drift-inner .bottle-box .bottle-hull {
        /* a restrained warm glow — enough to read as lit-from-within at a
           distance without the bottle itself reading as a yellow blob */
        filter: drop-shadow(0 0 3px rgba(240, 180, 110, 0.38)) drop-shadow(0 0 8px rgba(240, 180, 110, 0.18));
        /* fades the bottle's own silhouette into the water over its lower
           ~40% (a smooth gradient, never a hard edge — no clip-path here,
           so this can't produce the rectangular artifact a clipped+filtered
           element did elsewhere). Lives on the <use> alone, not the tint
           rect below, so the tint can grow more opaque in that same region
           instead of fading away with the hull. Bottoms out at a faint 10%
           rather than 0 — a trace of hull stays visible, it just reads as
           underwater instead of in open air. */
        -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 54%, rgba(0, 0, 0, 0.32) 66%, rgba(0, 0, 0, 0.1) 100%);
        mask-image: linear-gradient(to bottom, #000 0%, #000 54%, rgba(0, 0, 0, 0.32) 66%, rgba(0, 0, 0, 0.1) 100%);
      }

      /* the blue-green "water" the fading hull merges into. Clipped with an
         SVG clip-path (url(#mib-clip), static, never animated) to the
         bottle's own glass silhouette, so it reads as water on the glass —
         never as a rectangle around it. */
      .drift-inner .bottle-box .bottle-tint {
        pointer-events: none;
        mix-blend-mode: multiply;
      }

      .db-1 .drift-inner {
        top: 54.2%;
      }
      /* the composer is a fixed-width centre column: the near bottle's
         drift is keyed to 50vw ± 250px so it dips lower (and so further
         into #ocean-front's silhouette) while crossing that column,
         instead of drifting straight across in front of the writing
         surface, and resurfaces on the other side */
      .db-1 {
        animation: drift-ltr-dive 44s linear infinite;
        animation-delay: -10s;
      }
      .db-1 .drift-inner {
        animation-name: bottle-bob, dive-bottle;
        animation-duration: 3s, 44s;
        animation-timing-function: ease-in-out, linear;
        animation-iteration-count: infinite;
        animation-delay: 0s, -10s;
      }
      @keyframes drift-ltr-dive {
        0% {
          transform: translateX(-10vw);
        }
        45% {
          transform: translateX(calc(50vw - 250px));
        }
        55% {
          transform: translateX(calc(50vw + 250px));
        }
        100% {
          transform: translateX(110vw);
        }
      }
      @keyframes dive-bottle {
        0%,
        38%,
        62%,
        100% {
          translate: 0 0;
        }
        44%,
        56% {
          translate: 0 80px;
        }
      }
      .db-1 .drift-inner .bottle-box {
        width: 59px;
        height: 118px;
        margin: -59px 0 0 -29.5px;
        animation: rock-1 3.8s ease-in-out infinite;
      }

      .db-2 .drift-inner {
        top: 24.1%;
      }
      .db-2 {
        animation: drift-rtl 62s linear infinite;
        animation-delay: -19s;
      }
      .db-2 .drift-inner .bottle-box {
        width: 34px;
        height: 68px;
        margin: -34px 0 0 -17px;
        animation: rock-2 3.3s ease-in-out infinite;
      }

      .db-3 .drift-inner {
        top: 14.4%;
      }
      .db-3 {
        animation: drift-ltr 95s linear infinite;
        animation-delay: -51s;
      }
      .db-3 .drift-inner {
        animation-duration: 3.6s;
      }
      .db-3 .drift-inner .bottle-box {
        width: 20px;
        height: 40px;
        margin: -20px 0 0 -10px;
        animation: rock-3 3s ease-in-out infinite;
      }

      /* db-4/5/6: only ever activated in Dynamic Ocean Mode (visualLevel
         "many"), alongside db-1/2/3 — distinct speeds/sizes/delays from the
         first three so a varying population never looks mechanically
         repeated. */
      .db-4 .drift-inner {
        top: 38%;
      }
      .db-4 {
        animation: drift-rtl 70s linear infinite;
        animation-delay: -27s;
      }
      .db-4 .drift-inner .bottle-box {
        width: 28px;
        height: 56px;
        margin: -28px 0 0 -14px;
        animation: rock-4 3.5s ease-in-out infinite;
      }

      .db-5 .drift-inner {
        top: 20%;
      }
      .db-5 {
        animation: drift-ltr 101s linear infinite;
        animation-delay: -61s;
      }
      .db-5 .drift-inner .bottle-box {
        width: 18px;
        height: 36px;
        margin: -18px 0 0 -9px;
        animation: rock-5 3.1s ease-in-out infinite;
      }

      .db-6 .drift-inner {
        top: 46%;
      }
      .db-6 {
        animation: drift-rtl 58s linear infinite;
        animation-delay: -8s;
      }
      .db-6 .drift-inner .bottle-box {
        width: 24px;
        height: 48px;
        margin: -24px 0 0 -12px;
        animation: rock-6 3.7s ease-in-out infinite;
      }

      @keyframes drift-ltr {
        from {
          transform: translateX(-8vw);
        }
        to {
          transform: translateX(108vw);
        }
      }
      @keyframes drift-rtl {
        from {
          transform: translateX(108vw);
        }
        to {
          transform: translateX(-8vw);
        }
      }
      @keyframes bottle-bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-1.5px);
        }
      }
      @keyframes rock-1 {
        0%,
        100% {
          transform: rotate(38deg);
        }
        50% {
          transform: rotate(46deg);
        }
      }
      @keyframes rock-2 {
        0%,
        100% {
          transform: rotate(-36deg);
        }
        50% {
          transform: rotate(-44deg);
        }
      }
      @keyframes rock-3 {
        0%,
        100% {
          transform: rotate(35deg);
        }
        50% {
          transform: rotate(42deg);
        }
      }
      @keyframes rock-4 {
        0%,
        100% {
          transform: rotate(-32deg);
        }
        50% {
          transform: rotate(-40deg);
        }
      }
      @keyframes rock-5 {
        0%,
        100% {
          transform: rotate(33deg);
        }
        50% {
          transform: rotate(40deg);
        }
      }
      @keyframes rock-6 {
        0%,
        100% {
          transform: rotate(-34deg);
        }
        50% {
          transform: rotate(-41deg);
        }
      }

      /* a static grain over the whole sea, breaking the flat gradient
         bands into one continuous, slightly imperfect surface rather than
         stacked vector strips */
      .water-grain {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        mix-blend-mode: overlay;
        opacity: 0.6;
        pointer-events: none;
      }

      .horizon-line {
        position: absolute;
        top: 55%;
        left: 0;
        right: 0;
        height: 1.5px;
        background: linear-gradient(
          to right,
          transparent,
          rgba(155, 220, 238, 0.3) 30%,
          rgba(244, 239, 224, 0.75) 50%,
          rgba(240, 168, 104, 0.35) 70%,
          transparent
        );
        filter: blur(0.5px);
      }

      .anchor {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
      }

      #horizon-anchor {
        top: 55%;
        left: 50%;
      }

      /* --- the bottle, its note, and its ripple: the one interactive bottle --- */

      /* the wrapper owns position/scale/rotate and the warm glow; the inner
         .bottle-glass owns the submersion clip-path. Chromium renders a
         conspicuous rectangular highlight instead of a shape-following
         shadow when a CSS `filter: drop-shadow` and an animated `clip-path`
         are applied to the *same* transformed element — confirmed by
         screenshot: the box appears only while clip-path is non-zero, and
         vanishes the instant clip reaches 0%. Keeping filter and clip-path
         on two different elements avoids that rendering path entirely. */
      .bottle {
        position: fixed;
        top: 0;
        left: 0;
        width: 30px;
        height: 60px;
        opacity: 0;
        pointer-events: none;
        z-index: 5;
        filter: drop-shadow(0 0 6px rgba(240, 180, 110, 0.6)) drop-shadow(0 0 16px rgba(240, 180, 110, 0.3));
      }

      .bottle-glass {
        display: block;
        width: 100%;
        height: 100%;
      }

      .note-tuck {
        position: fixed;
        top: 0;
        left: 0;
        width: 14px;
        height: 10px;
        background: rgba(246, 223, 160, 0.92);
        border-radius: 2px;
        opacity: 0;
        pointer-events: none;
        z-index: 6;
      }

      .ripple {
        position: fixed;
        width: 14px;
        height: 14px;
        margin-left: -7px;
        margin-top: -7px;
        border: 1px solid rgba(215, 232, 242, 0.65);
        border-radius: 50%;
        opacity: 0;
        pointer-events: none;
        z-index: 4;
        box-shadow: 0 0 10px rgba(215, 232, 242, 0.35);
      }

      .ripple.play {
        animation: ripple-out 900ms ease-out;
      }

      @keyframes ripple-out {
        0% {
          opacity: 0.6;
          transform: scale(0.4);
        }
        100% {
          opacity: 0;
          transform: scale(3);
        }
      }

      /* --- foreground: the title, a line to write on, two words of
         light. --- */

      main {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2.25rem 1.25rem 3.5rem;
      }

      header {
        text-align: center;
        max-width: 30rem;
      }

      h1 {
        font-size: clamp(1.5rem, 1.15rem + 1.5vw, 2.15rem);
        font-weight: 400;
        letter-spacing: 0.02em;
        line-height: 1.2;
        margin: 0 0 0.5rem;
        color: var(--ink);
        text-shadow: 0 0 22px rgba(244, 239, 224, 0.2);
        white-space: nowrap;
      }

      header p {
        margin: 0;
        color: var(--ink-dim);
        font-size: 0.98rem;
        font-style: italic;
        letter-spacing: 0.01em;
        opacity: 0.85;
      }

      .spacer {
        flex: 1 1 auto;
        min-height: 1.5rem;
      }

      /* no card, no border, no fill — the writing surface sits directly in
         the scene, identified only by a thin line of light */
      .foreground {
        width: 100%;
        max-width: 19rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.7rem;
      }

      textarea {
        width: 100%;
        height: 3.6rem;
        resize: none;
        background: transparent;
        color: var(--ink);
        border: none;
        border-bottom: 1px solid rgba(232, 227, 248, 0.22);
        border-radius: 0;
        font-family: var(--serif);
        font-size: 1.02rem;
        line-height: 1.5;
        text-align: center;
        padding: 0.3rem 0.1rem 0.5rem;
        transition: border-color 250ms ease, box-shadow 250ms ease;
        /* standard property: Firefox, and current Chrome/Edge (which now
           honour this over the legacy ::-webkit-scrollbar-* rules below) —
           a thin cool-toned thumb on a transparent track, instead of the
           default light grey scrollbar block */
        scrollbar-width: thin;
        scrollbar-color: rgba(155, 220, 238, 0.42) transparent;
      }

      /* fallback for engines that don't yet honour scrollbar-color (Safari) */
      textarea::-webkit-scrollbar {
        width: 6px;
      }

      textarea::-webkit-scrollbar-track {
        background: transparent;
      }

      textarea::-webkit-scrollbar-thumb {
        background: rgba(155, 220, 238, 0.42);
        border-radius: 3px;
      }

      textarea::-webkit-scrollbar-thumb:hover {
        background: rgba(155, 220, 238, 0.62);
      }

      textarea::placeholder {
        color: rgba(241, 236, 242, 0.38);
        font-style: italic;
      }

      textarea:focus {
        outline: none;
        border-color: rgba(240, 168, 104, 0.6);
        box-shadow: 0 1px 0 0 rgba(240, 168, 104, 0.6);
      }

      .meta {
        display: flex;
        justify-content: center;
      }

      #count {
        font-family: var(--sans);
        font-size: 0.68rem;
        letter-spacing: 0.06em;
        font-variant-numeric: tabular-nums;
        color: var(--control-dim);
        opacity: 0.8;
      }

      /* two words of light, not two buttons */
      .controls {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 3rem;
        margin-top: 0.3rem;
      }

      button {
        font-family: var(--sans);
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        background: none;
        border: none;
        padding: 0.3rem 0.15rem;
        cursor: pointer;
        transition: color 200ms ease, text-shadow 200ms ease, transform 200ms ease;
      }

      /* each action's glow matches the ocean's own reaction to it — warm
         for Throw, cool for Catch — so the controls and the shared
         realtime response read as one material, not two unrelated ideas */
      #throw {
        color: var(--amber);
      }

      #catch {
        color: var(--cool);
      }

      button::after {
        content: "";
        display: block;
        margin: 0.3rem auto 0;
        width: 1.1em;
        height: 1px;
        background: currentColor;
        opacity: 0.5;
        transition: width 220ms ease, opacity 220ms ease;
      }

      button:hover:not(:disabled)::after,
      button:focus-visible::after {
        width: 100%;
        opacity: 0.95;
      }

      #throw:hover:not(:disabled) {
        transform: translateY(-2px);
        text-shadow: 0 0 16px var(--amber-soft);
      }

      #catch:hover:not(:disabled) {
        transform: translateY(2px);
        text-shadow: 0 0 16px var(--cool-soft);
      }

      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        transform: none;
      }

      button:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 5px;
        border-radius: 2px;
      }

      #dock-anchor {
        left: 50%;
        top: 50%;
      }

      .status {
        min-height: 1.1em;
        margin: 0;
        font-family: var(--sans);
        font-size: 0.85rem;
        letter-spacing: 0.01em;
        text-align: center;
        color: var(--status);
      }

      /* the caught message surfaces as text lit by the bottle's own glow,
         not a card — it belongs to the scene, not to a UI layer */
      .caught {
        margin: 0;
        color: var(--ink);
        text-shadow: 0 0 20px rgba(240, 168, 104, 0.3);
        font-family: var(--serif);
        font-size: 1.08rem;
        line-height: 1.65;
        letter-spacing: 0.005em;
        font-style: italic;
        text-align: center;
        white-space: pre-wrap;
        opacity: 0;
        transform: translateY(4px);
        transition: opacity 650ms ease, transform 650ms ease;
      }

      .caught.visible {
        opacity: 1;
        transform: translateY(0);
      }

      /* the empty-ocean line lives at the waterline, not with the form */
      .empty-message {
        position: fixed;
        left: 50%;
        top: calc(55% + 16px);
        transform: translateX(-50%);
        width: 90%;
        max-width: 24rem;
        margin: 0;
        text-align: center;
        color: var(--ink-dim);
        font-size: 0.98rem;
        font-style: italic;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.55);
        opacity: 0;
        transition: opacity 600ms ease;
        pointer-events: none;
      }

      .empty-message.visible {
        opacity: 1;
      }

      @media (max-width: 480px) {
        main {
          padding: 1.75rem 1.25rem 2.25rem;
        }

        header {
          max-width: 20rem;
        }

        h1 {
          font-size: 1.4rem;
          letter-spacing: 0.01em;
        }

        header p {
          font-size: 0.85rem;
        }

        .foreground {
          max-width: 17rem;
          gap: 0.55rem;
        }

        textarea {

          font-size: 0.95rem;
        }

        #count {
          font-size: 0.65rem;
        }

        .controls {
          gap: 2.1rem;
        }

        button {
          font-size: 0.72rem;
          letter-spacing: 0.14em;
        }

        .status,
        .caught {

        }

        .empty-message {

        }

        .bottle {

          height: 44px;
        }

        .moon {

          width: 42px;
          height: 42px;
        }

        .moon-path {
          width: 26%;
        }

        .db-1 {
          display: none;
        }

        .drift-inner {
          transition: translate 1.2s ease-in-out;
        }

        body:has(.caught.visible) .drift-inner {
          translate: 0 90px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .drift-outer,
        .drift-inner {
          animation: none;
          transition: none;
        }
        .db-1 {
          transform: translateX(22vw);
        }

        }
        .db-1 .drift-inner .bottle-box {

        .db-2 .drift-inner .bottle-box {

          transform: rotate(-40deg);

        .db-3 {
          transform: translateX(55vw);
        }
        .db-3 .drift-inner {
          animation: none;
        }
        .db-3 .drift-inner .bottle-box {
          animation: none;

        .db-4 {

        }

        .ripple.play {

        .caught,

        }
        .sea.realtime-pulse-thrown,

          animation-duration: 350ms;

        .moon-path {
          animation: none;
          opacity: 0.85;

      }
    </style>

  <body>
    <div class="scene" aria-hidden="true">

        <defs>

        </defs>

        <div class="drift-outer db-4">

        <!-- the nearest wave layer only, painted transparent everywhere else,

    <main>
      <header>
        <h1>Message in a Bottle</h1>
        <p>Write a message and throw it, or catch a random one someone else threw.</p>
      </header>

      <div class="spacer" aria-hidden="true"></div>

      <section class="foreground">
        <div class="meta"><span id="count">280 characters left</span></div>
        <textarea id="message" maxlength="280" placeholder="Write your message..." aria-label="Your message"></textarea>
        <div class="controls">
          <button id="throw" type="button">Throw</button>
          <button id="catch" type="button">Catch</button>
          <span id="dock-anchor" class="anchor"></span>

    <p id="empty-message" class="empty-message" aria-live="polite"></p>

    <script>
      const messageEl = document.getElementById("message");
      const countEl = document.getElementById("count");
      const throwBtn = document.getElementById("throw");
      const catchBtn = document.getElementById("catch");
      const statusEl = document.getElementById("status");
      const caughtEl = document.getElementById("caught-message");
      const emptyEl = document.getElementById("empty-message");
      const bottle = document.getElementById("bottle");
      const bottleGlass = document.getElementById("bottle-glass");
      const noteTuck = document.getElementById("note-tuck");
      const ripple = document.getElementById("ripple");
      const dockAnchor = document.getElementById("dock-anchor");
      const horizonAnchor = document.getElementById("horizon-anchor");
      const sea = document.querySelector(".sea");

      const MAX = 280;
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let currentAnims = [];

      // --- procedural ocean (replaces the old flat SVG wave bands) ---
      // Each layer sums a few incommensurate sine terms, so the surface
      // never visibly repeats, unlike a single translating path. A
      // moonlight glitter is computed from the real distance to the moon's
      // x position (read from --moon-left, so CSS stays the one source of
      // truth), not scattered at fixed coordinates. #ocean-front paints
      // only the nearest layer and is fully transparent elsewhere, so any
      // bottle sitting between #ocean-back and #ocean-front in the DOM is
      // covered by the real nearest wave wherever the two happen to
      // overlap — no per-bottle lip or mask is needed.
      (function initOcean() {
        const backCanvas = document.getElementById("ocean-back");
        const frontCanvas = document.getElementById("ocean-front");
        if (!backCanvas || !frontCanvas || !sea) return;
        const backCtx = backCanvas.getContext("2d");
        const frontCtx = frontCanvas.getContext("2d");
        if (!backCtx || !frontCtx) return;

        const moonLeftRaw = getComputedStyle(document.documentElement).getPropertyValue("--moon-left");
        const moonFrac = (parseFloat(moonLeftRaw) || 74) / 100;

        const BACK_LAYERS = [
          { baseFrac: 0.1, top: "#2f6b78", bottom: "#1f4a58", comps: [
            { amp: 3, freq: 0.0042, speed: 0.00035, phase: 0.3 },
            { amp: 1.6, freq: 0.0097, speed: -0.0006, phase: 1.8 },
            { amp: 0.8, freq: 0.021, speed: 0.0011, phase: 4.1 },
          ] },
          { baseFrac: 0.26, top: "#285d6c", bottom: "#1a3f4c", comps: [
            { amp: 5, freq: 0.0036, speed: 0.00042, phase: 2.1 },
            { amp: 2.2, freq: 0.0081, speed: -0.00075, phase: 0.6 },
            { amp: 1.0, freq: 0.017, speed: 0.0014, phase: 3.3 },
          ] },
          { baseFrac: 0.42, top: "#1f4f60", bottom: "#143440", comps: [
            { amp: 7, freq: 0.0031, speed: 0.00051, phase: 1.1 },
            { amp: 3.0, freq: 0.0069, speed: -0.00088, phase: 3.7 },
            { amp: 1.3, freq: 0.0145, speed: 0.0017, phase: 0.2 },
          ] },
          { baseFrac: 0.56, top: "#184252", bottom: "#0f2a36", comps: [
            { amp: 6, freq: 0.0027, speed: 0.0006, phase: 4.4 },
            { amp: 2.6, freq: 0.006, speed: -0.001, phase: 1.4 },
            { amp: 1.2, freq: 0.0125, speed: 0.002, phase: 2.6 },
          ] },
        ];
        // positioned so its resting line crosses the lower portion of the
        // nearest decorative bottle (db-1, anchored at top: 54.2%), so the
        // two-canvas sandwich actually submerges it rather than grazing it
        const FRONT_LAYER = {
          baseFrac: 0.67, top: "#0c2638", bottom: "#050f1a", comps: [
            { amp: 6, freq: 0.0023, speed: 0.00068, phase: 0.8 },
            { amp: 3.0, freq: 0.0052, speed: -0.0012, phase: 2.9 },
            { amp: 1.4, freq: 0.0108, speed: 0.0022, phase: 5.0 },
          ],
        };

        function waveY(x, t, layer, height) {
          let y = layer.baseFrac * height;
          for (const c of layer.comps) {
            y += c.amp * Math.sin(x * c.freq + t * c.speed + c.phase);
          }
          return y;
        }

        function drawLayer(ctx, layer, t, width, height, step) {
          const grad = ctx.createLinearGradient(0, layer.baseFrac * height, 0, height);
          grad.addColorStop(0, layer.top);
          grad.addColorStop(1, layer.bottom);

          ctx.beginPath();
          ctx.moveTo(0, waveY(0, t, layer, height));
          for (let x = step; x <= width; x += step) {
            ctx.lineTo(x, waveY(x, t, layer, height));
          }
          ctx.lineTo(width, height);
          ctx.lineTo(0, height);
          ctx.closePath();
          ctx.fillStyle = grad;
          ctx.fill();

          // crest highlight: a continuous stroke only where the real
          // rendered surface actually curves convex (a cheap curvature
          // estimate), so it traces the geometry rather than decorating it
          ctx.beginPath();
          let drawing = false;
          for (let x = step; x < width; x += step) {
            const y = waveY(x, t, layer, height);
            const yL = waveY(x - step, t, layer, height);
            const yR = waveY(x + step, t, layer, height);
            const curvature = yL - 2 * y + yR;
            if (curvature < -0.12) {
              if (drawing) ctx.lineTo(x, y);
              else {
                ctx.moveTo(x, y);
                drawing = true;
              }
            } else {
              drawing = false;
            }
          }
          ctx.strokeStyle = "rgba(210, 232, 240, 0.2)";
          ctx.lineWidth = 1;
          ctx.stroke();

          // moonlight glitter: sparse, flickering, concentrated under the
          // moon's actual x position — tied to geometry and a single light
          // source, not scattered at arbitrary fixed coordinates
          const moonX = width * moonFrac;
          const band = Math.max(80, width * 0.2);
          ctx.fillStyle = "rgba(230, 240, 245, 0.6)";
          for (let x = 0; x < width; x += step * 1.5) {
            const dist = Math.abs(x - moonX);
            if (dist > band) continue;
            const falloff = 1 - dist / band;
            const sparkle =
              Math.max(0, Math.sin(x * 0.15 + t * 0.0009 + layer.baseFrac * 10)) *
              Math.max(0, Math.sin(x * 0.37 - t * 0.0007 + layer.baseFrac * 20));
            const intensity = sparkle * falloff * falloff;
            if (intensity < 0.55) continue;
            ctx.globalAlpha = Math.min(0.6, intensity);
            ctx.fillRect(x, waveY(x, t, layer, height) - 0.5, 2, 1);
          }
          ctx.globalAlpha = 1;
        }

        let dpr = Math.min(window.devicePixelRatio || 1, 2);

        function resize() {
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          const rect = sea.getBoundingClientRect();
          for (const canvas of [backCanvas, frontCanvas]) {
            canvas.width = Math.max(1, Math.round(rect.width * dpr));
            canvas.height = Math.max(1, Math.round(rect.height * dpr));
          }
        }

        function render(t) {
          const cssWidth = sea.clientWidth;
          const cssHeight = sea.clientHeight;
          const step = 6;

          backCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
          backCtx.clearRect(0, 0, cssWidth, cssHeight);
          for (const layer of BACK_LAYERS) drawLayer(backCtx, layer, t, cssWidth, cssHeight, step);

          frontCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
          frontCtx.clearRect(0, 0, cssWidth, cssHeight);
          drawLayer(frontCtx, FRONT_LAYER, t, cssWidth, cssHeight, step);
        }

        resize();
        let lastT = 0;
        render(lastT);

        let resizeTimer = null;
        window.addEventListener("resize", () => {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(() => {
            resize();
            render(lastT);
          }, 120);
        });

        if (reducedMotion) return; // one static frame, no animation loop at all

        let lastDrawTime = 0;
        function loop(now) {
          if (now - lastDrawTime > 33) {
            lastT = now;
            render(now);
            lastDrawTime = now;
          }
          requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
      })();

      // --- ambient bottle population (decisions/0002) ---
      // Tracks GET /api/ocean's capped visualLevel: 0-3 uncaught messages
      // activates exactly that many lanes; "many" (4+) runs a restrained
      // randomly-varying population (2-4 lanes) that enters and leaves over
      // time, never settling on — or implying — the real number. Each lane
      // is a pre-existing drift-outer element (db-1..db-6); only its
      // `.active` class is ever touched here, so a lane's own drift/bob/rock
      // animation never resets when it's hidden and shown again.
      const AMBIENT_LANES = ["db-1", "db-2", "db-3", "db-4", "db-5", "db-6"];
      const ambientEls = Object.fromEntries(
        AMBIENT_LANES.map((name) => [name, document.querySelector(`.drift-outer.${name}`)]),
      );
      // db-1 is display:none on narrow viewports (no room for the
      // composer-dodge lane there) — leaving it out of the "many" pool on
      // mobile keeps the 2-4 visible count honest instead of occasionally
      // spending a slot on a lane nobody can see.
      const isNarrowViewport = window.matchMedia("(max-width: 480px)").matches;
      const EXACT_LANES = ["db-2", "db-3", "db-1"]; // priority order for visualLevel 1/2/3
      const MANY_POOL = isNarrowViewport ? ["db-2", "db-3", "db-4", "db-5", "db-6"] : AMBIENT_LANES;

      let activeLanes = new Set();
      let dynamicTimer = null;

      function setActiveLanes(names) {
        const next = new Set(names);
        for (const name of AMBIENT_LANES) {
          ambientEls[name]?.classList.toggle("active", next.has(name));
        }
        activeLanes = next;
      }

      function stopDynamicMode() {
        if (dynamicTimer !== null) {
          clearTimeout(dynamicTimer);
          dynamicTimer = null;
        }
      }

      function dynamicTick() {
        const current = new Set(activeLanes);
        const inactive = MANY_POOL.filter((name) => !current.has(name));
        const canGrow = current.size < 4 && inactive.length > 0;
        const canShrink = current.size > 2;
        const roll = Math.random();
        if (canGrow && (roll < 0.45 || !canShrink)) {
          current.add(inactive[Math.floor(Math.random() * inactive.length)]);
        } else if (canShrink) {
          const arr = [...current];
          current.delete(arr[Math.floor(Math.random() * arr.length)]);
        }
        setActiveLanes(current);
        dynamicTimer = setTimeout(dynamicTick, 4000 + Math.random() * 5000);
      }

      function startDynamicMode() {
        if (dynamicTimer !== null) return; // already running
        const shuffled = [...MANY_POOL].sort(() => Math.random() - 0.5);
        setActiveLanes(shuffled.slice(0, Math.random() < 0.5 ? 2 : 3));
        dynamicTimer = setTimeout(dynamicTick, 4000 + Math.random() * 5000);
      }

      function setAmbientLevel(level) {
        if (level === "many") {
          if (reducedMotion) {
            stopDynamicMode();
            setActiveLanes(MANY_POOL.slice(0, 3));
            return;
          }
          startDynamicMode();
          return;
        }
        stopDynamicMode();
        setActiveLanes(EXACT_LANES.slice(0, level));
      }

      function center(el) {
        const r = el.getBoundingClientRect();
        return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
      }

      function halfSize(el) {
        const r = el.getBoundingClientRect();
        return { bw: r.width / 2, bh: r.height / 2 };
      }

      function setPending(pending) {
        throwBtn.disabled = pending;
        catchBtn.disabled = pending;
      }

      function clearFeedback() {
        statusEl.textContent = "";
        caughtEl.textContent = "";
        caughtEl.classList.remove("visible");
        emptyEl.textContent = "";
        emptyEl.classList.remove("visible");
      }

      // Splits each keyframe across the two elements that actually need it:
      // transform/opacity go on the wrapper (.bottle, which carries the
      // glow), clipPath goes on .bottle-glass (the submersion cut) — see the
      // CSS comment above .bottle for why these must never land on the same
      // element. Callers don't need to know about the split: they still pass
      // one keyframes array with transform/opacity/clipPath/offset per frame.
      function play(keyframes, options) {
        for (const anim of currentAnims) {
          anim.finished.catch(() => {});
          anim.cancel();
        }
        const wrapperFrames = keyframes.map((k) => {
          const frame = { offset: k.offset };
          if (k.transform !== undefined) frame.transform = k.transform;
          if (k.opacity !== undefined) frame.opacity = k.opacity;
          return frame;
        });
        const anims = [bottle.animate(wrapperFrames, options)];
        if (keyframes.some((k) => k.clipPath !== undefined)) {
          const glassFrames = keyframes.map((k) => ({
            offset: k.offset,
            clipPath: k.clipPath ?? "inset(0 0 0% 0)",
          }));
          anims.push(bottleGlass.animate(glassFrames, options));
        }
        currentAnims = anims;
        return Promise.all(anims.map((a) => a.finished));
      }

      async function tuckNoteIntoBottle() {
        const dock = center(dockAnchor);
        const { bw, bh } = halfSize(bottle);

        await play(
          [
            { transform: `translate(${dock.x - bw}px, ${dock.y - bh}px) scale(1)`, opacity: 0, offset: 0 },
            { transform: `translate(${dock.x - bw}px, ${dock.y - bh}px) scale(1)`, opacity: 1, offset: 1 },
          ],
          { duration: reducedMotion ? 1 : 220, easing: "ease-out", fill: "forwards" },
        );

        if (reducedMotion) return;

        noteTuck.style.left = `${dock.x}px`;
        noteTuck.style.top = `${dock.y - 24}px`;
        noteTuck.style.transform = "translate(-50%, 0) scale(1)";
        noteTuck.style.opacity = "0.95";

        await noteTuck.animate(
          [
            { transform: "translate(-50%, 0) scale(1)", opacity: 0.95, offset: 0 },
            { transform: "translate(-50%, 18px) scale(0.4)", opacity: 0, offset: 1 },
          ],
          { duration: 280, easing: "ease-in", fill: "forwards" },
        ).finished;
      }

      function showRipple() {
        const pos = center(horizonAnchor);
        ripple.style.left = `${pos.x}px`;
        ripple.style.top = `${pos.y}px`;
        ripple.classList.remove("play");
        void ripple.offsetWidth;
        ripple.classList.add("play");
      }

      async function animateBottleOut() {
        const from = center(dockAnchor);
        const to = center(horizonAnchor);
        const { bw, bh } = halfSize(bottle);
        const apex = { x: from.x + (to.x - from.x) * 0.5, y: Math.min(from.y, to.y) - 70 };

        await play(
          [
            { transform: `translate(${from.x - bw}px, ${from.y - bh}px) scale(1) rotate(0deg)`, opacity: 1, offset: 0 },
            { transform: `translate(${apex.x - bw}px, ${apex.y - bh}px) scale(0.6) rotate(-18deg)`, opacity: 1, offset: 0.5 },
            { transform: `translate(${to.x - bw}px, ${to.y - bh}px) scale(0.22) rotate(10deg)`, opacity: 1, offset: 1 },
          ],
          { duration: reducedMotion ? 1 : 1200, easing: "cubic-bezier(0.3, 0, 0.2, 1)", fill: "forwards" },
        );

        showRipple();

        // clip-path cuts the bottle's lower half so it reads as submerged
        const at = (dx, dy, r, s = 0.22) => `translate(${to.x - bw + dx}px, ${to.y - bh + dy}px) scale(${s}) rotate(${r}deg)`;
        const sunk = "inset(0 0 45% 0)";

        if (!reducedMotion) {
          await play(
            [
              { transform: at(0, 0, 10), clipPath: "inset(0 0 0% 0)", opacity: 1, offset: 0 },
              { transform: at(2, 3, 50), clipPath: "inset(0 0 40% 0)", opacity: 1, offset: 0.6 },
              { transform: at(3, 2, 42), clipPath: sunk, opacity: 1, offset: 1 },
            ],
            { duration: 700, easing: "ease-out", fill: "forwards" },
          );
          await play(
            [
              { transform: at(3, 2, 42), clipPath: sunk, opacity: 1, offset: 0 },
              { transform: at(11, 1, 38), clipPath: sunk, opacity: 1, offset: 0.25 },
              { transform: at(19, 2, 46), clipPath: sunk, opacity: 1, offset: 0.5 },
              { transform: at(27, 1, 39), clipPath: sunk, opacity: 1, offset: 0.75 },
              { transform: at(34, 2, 43), clipPath: sunk, opacity: 1, offset: 1 },
            ],
            { duration: 1800, easing: "linear", fill: "forwards" },
          );
        }

        const endX = reducedMotion ? 0 : 34;
        const endR = reducedMotion ? 10 : 43;
        const endClip = reducedMotion ? "inset(0 0 0% 0)" : sunk;
        await play(
          [
            { transform: at(endX, 2, endR), clipPath: endClip, opacity: 1, offset: 0 },
            { transform: at(endX + 6, 1, endR, 0.16), clipPath: endClip, opacity: 0, offset: 1 },
          ],
          { duration: reducedMotion ? 1 : 700, easing: "ease-out", fill: "forwards" },
        );
      }

      async function animateBottleIn() {
        const from = center(horizonAnchor);
        const to = center(dockAnchor);
        const { bw, bh } = halfSize(bottle);

        // starts like a distant floater: tilted, lower half clipped as if
        // submerged; rights itself and surfaces as it nears the viewer
        const startR = reducedMotion ? 0 : -40;
        const startClip = reducedMotion ? 0 : 45;
        await play(
          [
            { transform: `translate(${from.x - bw}px, ${from.y - bh}px) scale(0.2) rotate(${startR}deg)`, clipPath: `inset(0 0 ${startClip}% 0)`, opacity: 0, offset: 0 },
            { transform: `translate(${from.x - bw}px, ${from.y - bh}px) scale(0.22) rotate(${startR}deg)`, clipPath: `inset(0 0 ${startClip}% 0)`, opacity: 1, offset: 1 },
          ],
          { duration: reducedMotion ? 1 : 250, easing: "ease-out", fill: "forwards" },
        );

        const bobs = reducedMotion
          ? [{ x: 0, y: 0, r: 0, c: 0 }]
          : [
              { x: 0, y: 0, r: -40, c: 45 },
              { x: 6, y: -6, r: -44, c: 42 },
              { x: -4, y: 4, r: -36, c: 36 },
              { x: 5, y: -3, r: -30, c: 22 },
              { x: 2, y: -2, r: -20, c: 8 },
              { x: 0, y: 0, r: -12, c: 0 },
            ];
        const keyframes = bobs.map((bob, i) => {
          const t = i / (bobs.length - 1 || 1);
          const x = from.x + (to.x - from.x) * t + bob.x;
          const y = from.y + (to.y - from.y) * t + bob.y;
          const scale = 0.22 + 0.78 * t;
          return {
            transform: `translate(${x - bw}px, ${y - bh}px) scale(${scale}) rotate(${bob.r}deg)`,
            clipPath: `inset(0 0 ${bob.c}% 0)`,
            opacity: 1,
            offset: t,
          };
        });
        await play(keyframes, { duration: reducedMotion ? 1 : 2200, easing: "ease-in-out", fill: "forwards" });

        const dock = center(dockAnchor);
        const endR = bobs[bobs.length - 1].r;
        await play(
          [
            { transform: `translate(${dock.x - bw}px, ${dock.y - bh}px) scale(1) rotate(${endR}deg)`, opacity: 1, offset: 0 },
            { transform: `translate(${dock.x - bw}px, ${dock.y - bh}px) scale(1.12) rotate(0deg)`, opacity: 1, offset: 0.5 },
            { transform: `translate(${dock.x - bw}px, ${dock.y - bh}px) scale(1) rotate(0deg)`, opacity: 0, offset: 1 },
          ],
          { duration: reducedMotion ? 150 : 450, easing: "ease-out", fill: "forwards" },
        );
      }

      // The realtime broadcast reaches the browser that triggered it too
      // (ADR 0001), almost immediately after its own POST resolves — long
      // before that browser's own multi-second flight sprite finishes. Applying
      // a population change right then would pop a second, ambient bottle
      // into view while the real one is still visibly in flight. flightBusy
      // defers the *visual* application (never the fetch — the latest level
      // is always read) until this client's own flight sprite has finished;
      // other clients, who have no competing flight animation, are unaffected
      // and apply changes immediately.
      let flightBusy = false;
      let pendingLevel = null;

      function applyAmbientLevel(level) {
        if (flightBusy) {
          pendingLevel = level;
          return;
        }
        setAmbientLevel(level);
      }

      function releasePendingAmbientLevel() {
        flightBusy = false;
        if (pendingLevel !== null) {
          const level = pendingLevel;
          pendingLevel = null;
          setAmbientLevel(level);
        }
      }

      // on failure the ocean simply stays as it was
      async function syncOcean() {
        try {
          const res = await fetch("/api/ocean", { cache: "no-store" });
          if (!res.ok) return;
          const { visualLevel } = await res.json();
          applyAmbientLevel(visualLevel);
        } catch {}
      }

      // Crit 9: a brief, anonymous reaction to anyone's Throw or Catch,
      // arriving over /api/events. The event carries only its type — no id,
      // message, count, or identity — so the type is the only thing this can
      // react to: thrown brightens outward, caught dims inward, neither tied
      // to any particular bottle on screen. It fires for every connected
      // browser alike, including the one whose own action caused it, so the
      // reaction lives only here: handleThrow/handleCatch never trigger it
      // directly, to avoid playing it twice for the browser that just acted.
      const PULSE_CLASSES = ["realtime-pulse-thrown", "realtime-pulse-caught"];

      function pulseOcean(kind) {
        sea.classList.remove(...PULSE_CLASSES);
        void sea.offsetWidth; // restart the animation if one is still playing
        sea.classList.add(`realtime-pulse-${kind}`);
      }

      sea.addEventListener("animationend", (event) => {
        if (event.animationName === "ocean-pulse-thrown" || event.animationName === "ocean-pulse-caught") {
          sea.classList.remove(...PULSE_CLASSES);
        }
      });

      const realtimeEvents = new EventSource("/api/events");
      realtimeEvents.addEventListener("thrown", () => {
        pulseOcean("thrown");
        syncOcean();
      });
      realtimeEvents.addEventListener("caught", () => {
        pulseOcean("caught");
        syncOcean();
      });
      // A fresh connection, or one reconnecting after a drop, may have missed
      // activity while it wasn't open. There is no backlog to replay — just
      // resync against whatever the durable ocean state actually is now.
      realtimeEvents.addEventListener("open", () => {
        syncOcean();
      });

      function pause(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      async function handleThrow() {
        const trimmed = messageEl.value.trim();
        clearFeedback();

        if (trimmed.length === 0) {
          statusEl.textContent = "Write something before you throw it.";
          return;
        }
        if (trimmed.length > MAX) {
          statusEl.textContent = "Keep it to 280 characters.";
          return;
        }

        setPending(true);
        throwBtn.textContent = "Throwing…";
        flightBusy = true;
        try {
          await tuckNoteIntoBottle();
          const [res] = await Promise.all([
            fetch("/api/bottles", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ message: trimmed }),
            }),
            animateBottleOut(),
          ]);
          if (res.status === 201) {
            messageEl.value = "";
            countEl.textContent = `${MAX} characters left`;
            syncOcean();
          } else {
            statusEl.textContent = "That message couldn't be thrown. Try again.";
          }
        } catch {
          statusEl.textContent = "Could not reach the ocean. Try again.";
        } finally {
          releasePendingAmbientLevel();
          setPending(false);
          throwBtn.textContent = "Throw";
        }
      }

      async function handleCatch() {
        clearFeedback();
        setPending(true);
        catchBtn.textContent = "Catching…";
        flightBusy = true;
        try {
          const res = await fetch("/api/bottles/catch", { method: "POST" });
          const body = await res.json();
          if (body.bottle) {
            await animateBottleIn();
            caughtEl.textContent = body.bottle.message;
            caughtEl.classList.add("visible");
          } else {
            await pause(reducedMotion ? 150 : 700);
            emptyEl.textContent = body.message;
            emptyEl.classList.add("visible");
          }
          syncOcean();
        } catch {
          statusEl.textContent = "Could not reach the ocean. Try again.";
        } finally {
          releasePendingAmbientLevel();
          setPending(false);
          catchBtn.textContent = "Catch";
        }
      }

      messageEl.addEventListener("input", () => {
        countEl.textContent = `${MAX - messageEl.value.length} characters left`;
        if (statusEl.textContent || caughtEl.classList.contains("visible") || emptyEl.classList.contains("visible")) {
          clearFeedback();
        }
      });

      throwBtn.addEventListener("click", handleThrow);
      catchBtn.addEventListener("click", handleCatch);
      syncOcean();
    </script>
  </body>
</html>
