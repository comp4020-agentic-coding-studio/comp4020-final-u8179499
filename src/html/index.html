<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Message in a Bottle</title>
    <style>
      :root {
        --sky-top: #cfe9f5;
        --sky-bottom: #8fc9de;
        --sea-top: #6fb4c8;
        --sea-bottom: #0c3a55;
        --ink: #1c2e38;
        --ink-dim: #4c6772;
        --control: #f5f1e6;
        --control-dim: #d7e6ea;
        --status: #a15a17;
        --paper: #ece7d8;
        --paper-ink: #241f14;
        --sun-left: 80%;
        --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
        --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        font-family: var(--serif);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        background: var(--sky-top);
        overflow-x: hidden;
      }

      /* --- the scene: sky, sun haze, sea, horizon --- */

      .scene {
        position: fixed;
        inset: 0;
        overflow: hidden;
        z-index: -1;
      }

      .sky {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 55%;
        background: linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));
      }

      .sun {
        position: absolute;
        top: 12%;
        left: var(--sun-left);
        width: 64px;
        height: 64px;
        transform: translateX(-50%);
        border-radius: 50%;
        background: radial-gradient(circle at 45% 42%, #fffbea 0%, #fff2c8 55%, #fbe7ae 100%);
        box-shadow:
          0 0 14px 4px rgba(255, 241, 204, 0.45),
          0 0 46px 18px rgba(255, 244, 216, 0.16);
        filter: blur(0.6px);
      }

      .sea {
        position: absolute;
        top: 55%;
        left: 0;
        right: 0;
        bottom: 0;
        overflow: hidden;
        background: linear-gradient(to bottom, var(--sea-top), var(--sea-bottom));
      }

      /* Crit 9: a brief, content-free reaction of the sea itself — the only
         perceptible trace that a Throw or Catch happened somewhere,
         anonymous and identical for every viewer, including the one whose
         own action caused it. No count, no label, no position tied to any
         bottle. Thrown and caught get distinct but equally subtle
         treatments — brightening outward vs. dimming inward — since the
         ADR allows the action type itself to be visible. */
      @keyframes ocean-pulse-thrown {
        0% {
          filter: brightness(1) saturate(1);
        }
        30% {
          filter: brightness(1.22) saturate(1.15);
        }
        100% {
          filter: brightness(1) saturate(1);
        }
      }

      @keyframes ocean-pulse-caught {
        0% {
          filter: brightness(1) saturate(1);
        }
        35% {
          filter: brightness(0.86) saturate(0.88);
        }
        100% {
          filter: brightness(1) saturate(1);
        }
      }

      .sea.realtime-pulse-thrown {
        animation: ocean-pulse-thrown 700ms ease-out;
      }

      .sea.realtime-pulse-caught {
        animation: ocean-pulse-caught 700ms ease-in-out;
      }

      /* filled wave masses, far to near. Each nearer mass covers the lower
         part of the one behind it, so each shows as a lit face darkening
         into a trough. Strips are 200% wide holding two identical periods,
         so sliding by 50% loops seamlessly; there is no vertical motion. */
      .swell {
        position: absolute;
        left: 0;
        bottom: 0;
        width: max(200%, 2400px);
      }

      .swell svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .ltr {
        animation: swell-ltr linear infinite;
      }
      .rtl {
        animation: swell-rtl linear infinite;
      }

      @keyframes swell-rtl {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-50%);
        }
      }
      @keyframes swell-ltr {
        from {
          transform: translateX(-50%);
        }
        to {
          transform: translateX(0);
        }
      }

      .s1 { top: 1.5%; animation-duration: 150s; animation-delay: -40s; }
      .s2 { top: 6%; animation-duration: 120s; animation-delay: -70s; }
      .s3 { top: 13%; animation-duration: 95s; animation-delay: -15s; }
      .s4 { top: 24%; animation-duration: 72s; animation-delay: -50s; }
      .s5 { top: 38%; animation-duration: 54s; animation-delay: -9s; }
      .s6 { top: 56%; animation-duration: 40s; animation-delay: -26s; }

      /* atmospheric only: fixed count, no data behind them, not interactive.
         Each bottle sits in the DOM between two wave masses, centred just
         above the trough line of the mass in front, so that mass's opaque
         water physically covers its lower part.
         outer: travels across the sea; inner: tiny bob; svg: tilt + rock */
      .drift-outer {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 0;
        pointer-events: none;
        visibility: hidden;
        opacity: 0;
        transition: opacity 0.8s ease, visibility 0.8s;
      }

      /* the visible trace: bottles float only while the shared ocean really
         holds an uncaught one (GET /api/ocean); an empty ocean shows none */
      .scene.has-bottles .drift-outer {
        visibility: visible;
        opacity: 1;
      }

      .drift-inner {
        position: absolute;
        left: 0;
        animation: bottle-bob 3s ease-in-out infinite;
      }

      /* a swell riding with the bottle, painted with the exact gradient of
         the wave mass in front (same coordinate space, so it is seamless):
         it keeps about half the bottle under water even in a trough */
      .lip {
        position: absolute;
        display: block;
        overflow: visible;
      }
      .db-1 .lip { top: 56%; height: 44%; left: -190px; width: 380px; }
      .db-2 .lip { top: 24%; height: 76%; left: -120px; width: 240px; }
      .db-3 .lip { top: 13%; height: 87%; left: -65px; width: 130px; }

      .drift-inner svg {
        display: block;
        transform-origin: 50% 50%;
      }

      .db-1 .drift-inner {
        top: 54.2%;
      }
      /* the composer is a fixed-width centre column: the near bottle's
         drift is keyed to 50vw ± 250px so it sinks behind its swell while
         crossing that column and resurfaces on the other side */
      .db-1 {
        animation: drift-ltr-dive 44s linear infinite;
        animation-delay: -10s;
      }
      .db-1 .drift-inner,
      .db-1 .lip {
        animation-name: bottle-bob, dive-bottle;
        animation-duration: 3s, 44s;
        animation-timing-function: ease-in-out, linear;
        animation-iteration-count: infinite;
        animation-delay: 0s, -10s;
      }
      .db-1 .lip {
        animation-name: dive-swell;
        animation-duration: 44s;
        animation-timing-function: linear;
        animation-delay: -10s;
      }
      @keyframes drift-ltr-dive {
        0% {
          transform: translateX(-10vw);
        }
        45% {
          transform: translateX(calc(50vw - 250px));
        }
        55% {
          transform: translateX(calc(50vw + 250px));
        }
        100% {
          transform: translateX(110vw);
        }
      }
      @keyframes dive-bottle {
        0%,
        38%,
        62%,
        100% {
          translate: 0 0;
        }
        44%,
        56% {
          translate: 0 130px;
        }
      }
      @keyframes dive-swell {
        0%,
        38%,
        62%,
        100% {
          translate: 0 0;
        }
        44%,
        56% {
          translate: 0 45px;
        }
      }
      .db-1 .drift-inner svg {
        width: 59px;
        height: 118px;
        margin: -59px 0 0 -29.5px;
        animation: rock-1 3.8s ease-in-out infinite;
      }

      .db-2 .drift-inner {
        top: 24.1%;
      }
      .db-2 {
        animation: drift-rtl 62s linear infinite;
        animation-delay: -19s;
      }
      .db-2 .drift-inner svg {
        width: 34px;
        height: 68px;
        margin: -34px 0 0 -17px;
        animation: rock-2 3.3s ease-in-out infinite;
      }

      .db-3 .drift-inner {
        top: 14.4%;
      }
      .db-3 {
        animation: drift-ltr 95s linear infinite;
        animation-delay: -51s;
      }
      .db-3 .drift-inner {
        animation-duration: 3.6s;
      }
      .db-3 .drift-inner svg {
        width: 20px;
        height: 40px;
        margin: -20px 0 0 -10px;
        animation: rock-3 3s ease-in-out infinite;
      }

      @keyframes drift-ltr {
        from {
          transform: translateX(-8vw);
        }
        to {
          transform: translateX(108vw);
        }
      }
      @keyframes drift-rtl {
        from {
          transform: translateX(108vw);
        }
        to {
          transform: translateX(-8vw);
        }
      }
      @keyframes bottle-bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-1.5px);
        }
      }
      @keyframes rock-1 {
        0%,
        100% {
          transform: rotate(38deg);
        }
        50% {
          transform: rotate(46deg);
        }
      }
      @keyframes rock-2 {
        0%,
        100% {
          transform: rotate(-36deg);
        }
        50% {
          transform: rotate(-44deg);
        }
      }
      @keyframes rock-3 {
        0%,
        100% {
          transform: rotate(35deg);
        }
        50% {
          transform: rotate(42deg);
        }
      }

      /* the composer's height varies (a caught note pushes it up), so every
         bottle sinks while crossing its column rather than relying on
         track height; on mobile the column is the full width, see below */
      @media (min-width: 481px) {
        .db-2 {
          animation-name: drift-rtl-dive;
        }
        .db-2 .drift-inner {
          animation-name: bottle-bob, dive-bottle-mid;
          animation-duration: 3s, 62s;
          animation-timing-function: ease-in-out, linear;
          animation-iteration-count: infinite;
          animation-delay: 0s, -19s;
        }
        .db-2 .lip {
          animation: dive-swell-mid 62s linear infinite;
          animation-delay: -19s;
        }
        .db-3 {
          animation-name: drift-ltr-dive-far;
        }
        .db-3 .drift-inner {
          animation-name: bottle-bob, dive-bottle-far;
          animation-duration: 3.6s, 95s;
          animation-timing-function: ease-in-out, linear;
          animation-iteration-count: infinite;
          animation-delay: 0s, -51s;
        }
        .db-3 .lip {
          animation: dive-swell-far 95s linear infinite;
          animation-delay: -51s;
        }
      }
      @keyframes drift-ltr-dive-far {
        0% {
          transform: translateX(-10vw);
        }
        45% {
          transform: translateX(calc(50vw - 215px));
        }
        55% {
          transform: translateX(calc(50vw + 215px));
        }
        100% {
          transform: translateX(110vw);
        }
      }
      @keyframes dive-bottle-far {
        0%,
        38%,
        62%,
        100% {
          translate: 0 0;
        }
        44%,
        56% {
          translate: 0 55px;
        }
      }
      @keyframes dive-swell-far {
        0%,
        38%,
        62%,
        100% {
          translate: 0 0;
        }
        44%,
        56% {
          translate: 0 15px;
        }
      }
      @keyframes drift-rtl-dive {
        0% {
          transform: translateX(110vw);
        }
        45% {
          transform: translateX(calc(50vw + 230px));
        }
        55% {
          transform: translateX(calc(50vw - 230px));
        }
        100% {
          transform: translateX(-10vw);
        }
      }
      @keyframes dive-bottle-mid {
        0%,
        38%,
        62%,
        100% {
          translate: 0 0;
        }
        44%,
        56% {
          translate: 0 80px;
        }
      }
      @keyframes dive-swell-mid {
        0%,
        38%,
        62%,
        100% {
          translate: 0 0;
        }
        44%,
        56% {
          translate: 0 25px;
        }
      }

      .horizon-line {
        position: absolute;
        top: 55%;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.6), transparent);
        filter: blur(0.5px);
      }

      .anchor {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
      }

      #horizon-anchor {
        top: 55%;
        left: 50%;
      }

      /* --- the bottle, its note, and its ripple: the one interactive bottle --- */

      .bottle {
        position: fixed;
        top: 0;
        left: 0;
        width: 30px;
        height: 60px;
        color: var(--paper-ink);
        opacity: 0;
        pointer-events: none;
        z-index: 5;
      }

      .note-tuck {
        position: fixed;
        top: 0;
        left: 0;
        width: 14px;
        height: 10px;
        background: rgba(236, 231, 216, 0.9);
        border-radius: 2px;
        opacity: 0;
        pointer-events: none;
        z-index: 6;
      }

      .ripple {
        position: fixed;
        width: 14px;
        height: 14px;
        margin-left: -7px;
        margin-top: -7px;
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 50%;
        opacity: 0;
        pointer-events: none;
        z-index: 4;
      }

      .ripple.play {
        animation: ripple-out 900ms ease-out;
      }

      @keyframes ripple-out {
        0% {
          opacity: 0.6;
          transform: scale(0.4);
        }
        100% {
          opacity: 0;
          transform: scale(3);
        }
      }

      /* --- foreground: title, writing surface, the two actions --- */

      main {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2.5rem 1.25rem 3rem;
      }

      header {
        text-align: center;
        max-width: 44rem;
      }

      h1 {
        font-size: clamp(1.5rem, 1.1rem + 1.5vw, 2.05rem);
        font-weight: 500;
        letter-spacing: 0.015em;
        line-height: 1.15;
        margin: 0 0 0.55rem;
        color: var(--ink);
      }

      header p {
        margin: 0;
        color: var(--ink-dim);
        font-size: 0.98rem;
        font-style: italic;
        letter-spacing: 0.01em;
      }

      .spacer {
        flex: 1 1 auto;
        min-height: 1.5rem;
      }

      .foreground {
        width: 100%;
        max-width: 22rem;
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
      }

      /* the writing surface reads as a small note, not a form control */
      textarea {
        width: 100%;
        height: 5rem;
        resize: none;
        background: rgba(236, 231, 216, 0.92);
        color: var(--paper-ink);
        border: 1px solid rgba(120, 100, 70, 0.22);
        border-radius: 8px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
        font-family: var(--serif);
        font-size: 1rem;
        line-height: 1.5;
        padding: 0.65rem 0.85rem;
      }

      textarea::placeholder {
        color: rgba(36, 31, 20, 0.45);
        font-style: italic;
      }

      textarea:focus {
        outline: 2px solid rgba(255, 255, 255, 0.85);
        outline-offset: 2px;
      }

      .meta {
        display: flex;
        justify-content: flex-end;
        padding-right: 0.2rem;
      }

      #count {
        font-family: var(--sans);
        font-size: 0.72rem;
        letter-spacing: 0.04em;
        font-variant-numeric: tabular-nums;
        color: var(--control-dim);
        opacity: 0.85;
      }

      /* textarea-wide row, both actions inset equally from its edges */
      .controls {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 1.25rem;
        margin-top: 0.5rem;
      }

      button {
        font-family: var(--sans);
        font-size: 0.88rem;
        font-weight: 500;
        letter-spacing: 0.06em;
        min-width: 7rem;
        padding: 0.55rem 1.2rem;
        background: transparent;
        color: var(--control);
        border: 1px solid rgba(245, 241, 230, 0.6);
        border-radius: 4px;
        cursor: pointer;
        transition: opacity 200ms ease, background 200ms ease, transform 200ms ease;
      }

      button:hover:not(:disabled) {
        background: rgba(245, 241, 230, 0.12);
      }

      /* quiet, directional hints rather than bright call-to-action styling */
      #throw:hover:not(:disabled) {
        transform: translateY(-2px);
      }

      #catch:hover:not(:disabled) {
        transform: translateY(2px);
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        transform: none;
      }

      #dock-anchor {
        left: 50%;
        top: 50%;
      }

      .status {
        min-height: 1.1em;
        margin: 0;
        font-family: var(--sans);
        font-size: 0.85rem;
        letter-spacing: 0.01em;
        color: var(--status);
      }

      /* the caught message arrives on its own small note, as if it came
         out of the bottle */
      .caught {
        margin: 0;
        background: rgba(236, 231, 216, 0.88);
        color: var(--paper-ink);
        border: 1px solid rgba(120, 100, 70, 0.2);
        border-radius: 8px;
        padding: 0.75rem 0.9rem;
        font-family: var(--serif);
        font-size: 1.03rem;
        line-height: 1.6;
        letter-spacing: 0.005em;
        font-style: italic;
        white-space: pre-wrap;
        opacity: 0;
        transform: translateY(4px);
        transition: opacity 500ms ease, transform 500ms ease;
      }

      .caught.visible {
        opacity: 1;
        transform: translateY(0);
      }

      /* the empty-ocean line lives at the waterline, not with the form */
      .empty-message {
        position: fixed;
        left: 50%;
        top: calc(55% + 16px);
        transform: translateX(-50%);
        width: 90%;
        max-width: 24rem;
        margin: 0;
        text-align: center;
        color: var(--control-dim);
        font-size: 0.98rem;
        font-style: italic;
        opacity: 0;
        transition: opacity 600ms ease;
        pointer-events: none;
      }

      .empty-message.visible {
        opacity: 1;
      }

      @media (max-width: 480px) {
        main {
          padding: 2rem 1.5rem 2.25rem;
        }

        h1 {
          font-size: 1.3rem;
        }

        header p {
          font-size: 0.82rem;
        }

        .foreground {
          max-width: 18rem;
          gap: 0.5rem;
        }

        textarea {
          height: 4.25rem;
          font-size: 0.92rem;
          padding: 0.55rem 0.7rem;
        }

        #count {
          font-size: 0.68rem;
        }

        .controls {
          padding: 0 0.75rem;
        }

        button {
          font-size: 0.82rem;
          min-width: 6rem;
          padding: 0.45rem 0.9rem;
        }

        .status,
        .caught {
          font-size: 0.85rem;
        }

        .empty-message {
          font-size: 0.82rem;
        }

        .bottle {
          width: 22px;
          height: 44px;
        }

        .sun {
          top: 24%;
          width: 50px;
          height: 50px;
        }

        .db-1 {
          display: none;
        }

        .drift-inner {
          transition: translate 1.2s ease-in-out;
        }

        body:has(.caught.visible) .drift-inner {
          translate: 0 90px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .swell,
        .drift-outer,
        .drift-inner {
          animation: none;
          transition: none;
        }
        .db-1 {
          transform: translateX(22vw);
        }
        .db-1 .drift-inner,
        .db-1 .lip {
          animation: none;
        }
        .db-1 .drift-inner svg {
          animation: none;
          transform: rotate(42deg);
        }
        .db-2 {
          transform: translateX(72vw);
        }
        .db-2 .drift-inner,
        .db-2 .lip {
          animation: none;
        }
        .db-2 .drift-inner svg {
          animation: none;
          transform: rotate(-40deg);
        }
        .db-3 {
          transform: translateX(55vw);
        }
        .db-3 .drift-inner,
        .db-3 .lip {
          animation: none;
        }
        .db-3 .drift-inner svg {
          animation: none;
          transform: rotate(38deg);
        }
        .ripple.play {
          animation-duration: 200ms;
        }
        .caught,
        .empty-message {
          transition-duration: 150ms;
        }
        .sea.realtime-pulse-thrown,
        .sea.realtime-pulse-caught {
          animation-duration: 350ms;
        }
      }
    </style>
  </head>
  <body>
    <div class="scene" aria-hidden="true">
      <svg class="scene-defs" width="0" height="0" aria-hidden="true">
        <defs>
          <linearGradient id="mib-glass" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#2a7a70" stop-opacity="0.9" />
            <stop offset="0.15" stop-color="#7cc6b6" stop-opacity="0.7" />
            <stop offset="0.5" stop-color="#c8efe4" stop-opacity="0.45" />
            <stop offset="0.85" stop-color="#6fb7a8" stop-opacity="0.7" />
            <stop offset="1" stop-color="#256e66" stop-opacity="0.9" />
          </linearGradient>
          <linearGradient id="mib-paper" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#dcc796" />
            <stop offset="0.35" stop-color="#fbf3da" />
            <stop offset="0.7" stop-color="#f3e6c2" />
            <stop offset="1" stop-color="#d4bd88" />
          </linearGradient>
          <linearGradient id="mib-cork" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#6d4323" />
            <stop offset="0.5" stop-color="#a8743f" />
            <stop offset="1" stop-color="#6a4020" />
          </linearGradient>
          <symbol id="mib" viewBox="0 0 60 120">
            <path
              d="M24.5 14 H35.5 V35 C35.5 40 48 43 48 54 V104 C48 112 40 116 30 116 C20 116 12 112 12 104 V54 C12 43 24.5 40 24.5 35 Z"
              fill="rgba(150, 205, 190, 0.3)"
            />
            <g transform="rotate(-8 30 66)">
              <rect x="21" y="46" width="18" height="40" rx="4" fill="url(#mib-paper)" />

            </linearGradient>

            <path d="M2161.0,28.52 C2165.4,28.17 2178.6,28.17 2183.0,28.52" fill="none" stroke="rgba(255,255,255,0.42)" stroke-width="1.5" stroke-linecap="round" vector-effect="non-scaling-stroke" />

        </div>
      </div>
      <div class="horizon-line"></div>
      <span id="horizon-anchor" class="anchor"></span>
    </div>

    <svg id="bottle" class="bottle" viewBox="0 0 60 120" aria-hidden="true"><use href="#mib" /></svg>
    <div id="note-tuck" class="note-tuck" aria-hidden="true"></div>
    <div id="ripple" class="ripple" aria-hidden="true"></div>

    <main>
      <header>
        <h1>Message in a Bottle</h1>
        <p>Write a message and throw it, or catch a random one someone else threw.</p>
      </header>

      <div class="spacer" aria-hidden="true"></div>

      <section class="foreground">
        <div class="meta"><span id="count">280 characters left</span></div>
        <textarea id="message" maxlength="280" placeholder="Write your message..." aria-label="Your message"></textarea>
        <div class="controls">
          <button id="throw" type="button">Throw</button>
          <button id="catch" type="button">Catch</button>
          <span id="dock-anchor" class="anchor"></span>
        </div>
        <p id="status" class="status" aria-live="polite"></p>
        <p id="caught-message" class="caught" aria-live="polite"></p>
      </section>
    </main>

    <p id="empty-message" class="empty-message" aria-live="polite"></p>

    <script>
      const messageEl = document.getElementById("message");
      const countEl = document.getElementById("count");
      const throwBtn = document.getElementById("throw");
      const catchBtn = document.getElementById("catch");
      const statusEl = document.getElementById("status");
      const caughtEl = document.getElementById("caught-message");
      const emptyEl = document.getElementById("empty-message");
      const bottle = document.getElementById("bottle");
      const noteTuck = document.getElementById("note-tuck");
      const ripple = document.getElementById("ripple");
      const dockAnchor = document.getElementById("dock-anchor");
      const horizonAnchor = document.getElementById("horizon-anchor");
      const scene = document.querySelector(".scene");
      const sea = document.querySelector(".sea");

      const MAX = 280;
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let currentAnim = null;

      function center(el) {
        const r = el.getBoundingClientRect();
        return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
      }

      function halfSize(el) {
        const r = el.getBoundingClientRect();
        return { bw: r.width / 2, bh: r.height / 2 };
      }

      function setPending(pending) {
        throwBtn.disabled = pending;
        catchBtn.disabled = pending;
      }

      function clearFeedback() {
        statusEl.textContent = "";
        caughtEl.textContent = "";
        caughtEl.classList.remove("visible");
        emptyEl.textContent = "";
        emptyEl.classList.remove("visible");
      }

      function play(keyframes, options) {
        if (currentAnim) currentAnim.cancel();
        currentAnim = bottle.animate(keyframes, options);
        return currentAnim.finished;
      }

      async function tuckNoteIntoBottle() {
        const dock = center(dockAnchor);
        const { bw, bh } = halfSize(bottle);

        await play(
          [
            { transform: `translate(${dock.x - bw}px, ${dock.y - bh}px) scale(1)`, opacity: 0, offset: 0 },
            { transform: `translate(${dock.x - bw}px, ${dock.y - bh}px) scale(1)`, opacity: 1, offset: 1 },
          ],
          { duration: reducedMotion ? 1 : 220, easing: "ease-out", fill: "forwards" },
        );

        if (reducedMotion) return;

        noteTuck.style.left = `${dock.x}px`;
        noteTuck.style.top = `${dock.y - 24}px`;
        noteTuck.style.transform = "translate(-50%, 0) scale(1)";
        noteTuck.style.opacity = "0.95";

        await noteTuck.animate(
          [
            { transform: "translate(-50%, 0) scale(1)", opacity: 0.95, offset: 0 },
            { transform: "translate(-50%, 18px) scale(0.4)", opacity: 0, offset: 1 },
          ],
          { duration: 280, easing: "ease-in", fill: "forwards" },
        ).finished;
      }

      function showRipple() {
        const pos = center(horizonAnchor);
        ripple.style.left = `${pos.x}px`;
        ripple.style.top = `${pos.y}px`;
        ripple.classList.remove("play");
        void ripple.offsetWidth;
        ripple.classList.add("play");
      }

      async function animateBottleOut() {
        const from = center(dockAnchor);
        const to = center(horizonAnchor);
        const { bw, bh } = halfSize(bottle);
        const apex = { x: from.x + (to.x - from.x) * 0.5, y: Math.min(from.y, to.y) - 70 };

        await play(
          [
            { transform: `translate(${from.x - bw}px, ${from.y - bh}px) scale(1) rotate(0deg)`, opacity: 1, offset: 0 },
            { transform: `translate(${apex.x - bw}px, ${apex.y - bh}px) scale(0.6) rotate(-18deg)`, opacity: 1, offset: 0.5 },
            { transform: `translate(${to.x - bw}px, ${to.y - bh}px) scale(0.22) rotate(10deg)`, opacity: 1, offset: 1 },
          ],
          { duration: reducedMotion ? 1 : 1200, easing: "cubic-bezier(0.3, 0, 0.2, 1)", fill: "forwards" },
        );

        showRipple();

        // clip-path cuts the bottle's lower half so it reads as submerged
        const at = (dx, dy, r, s = 0.22) => `translate(${to.x - bw + dx}px, ${to.y - bh + dy}px) scale(${s}) rotate(${r}deg)`;
        const sunk = "inset(0 0 45% 0)";

        if (!reducedMotion) {
          await play(
            [
              { transform: at(0, 0, 10), clipPath: "inset(0 0 0% 0)", opacity: 1, offset: 0 },
              { transform: at(2, 3, 50), clipPath: "inset(0 0 40% 0)", opacity: 1, offset: 0.6 },
              { transform: at(3, 2, 42), clipPath: sunk, opacity: 1, offset: 1 },
            ],
            { duration: 700, easing: "ease-out", fill: "forwards" },
          );
          await play(
            [
              { transform: at(3, 2, 42), clipPath: sunk, opacity: 1, offset: 0 },
              { transform: at(11, 1, 38), clipPath: sunk, opacity: 1, offset: 0.25 },
              { transform: at(19, 2, 46), clipPath: sunk, opacity: 1, offset: 0.5 },
              { transform: at(27, 1, 39), clipPath: sunk, opacity: 1, offset: 0.75 },
              { transform: at(34, 2, 43), clipPath: sunk, opacity: 1, offset: 1 },
            ],
            { duration: 1800, easing: "linear", fill: "forwards" },
          );
        }

        const endX = reducedMotion ? 0 : 34;
        const endR = reducedMotion ? 10 : 43;
        const endClip = reducedMotion ? "inset(0 0 0% 0)" : sunk;
        await play(
          [
            { transform: at(endX, 2, endR), clipPath: endClip, opacity: 1, offset: 0 },
            { transform: at(endX + 6, 1, endR, 0.16), clipPath: endClip, opacity: 0, offset: 1 },
          ],
          { duration: reducedMotion ? 1 : 700, easing: "ease-out", fill: "forwards" },
        );
      }

      async function animateBottleIn() {
        const from = center(horizonAnchor);
        const to = center(dockAnchor);
        const { bw, bh } = halfSize(bottle);

        // starts like a distant floater: tilted, lower half clipped as if
        // submerged; rights itself and surfaces as it nears the viewer
        const startR = reducedMotion ? 0 : -40;
        const startClip = reducedMotion ? 0 : 45;
        await play(
          [
            { transform: `translate(${from.x - bw}px, ${from.y - bh}px) scale(0.2) rotate(${startR}deg)`, clipPath: `inset(0 0 ${startClip}% 0)`, opacity: 0, offset: 0 },
            { transform: `translate(${from.x - bw}px, ${from.y - bh}px) scale(0.22) rotate(${startR}deg)`, clipPath: `inset(0 0 ${startClip}% 0)`, opacity: 1, offset: 1 },
          ],
          { duration: reducedMotion ? 1 : 250, easing: "ease-out", fill: "forwards" },
        );

        const bobs = reducedMotion
          ? [{ x: 0, y: 0, r: 0, c: 0 }]
          : [
              { x: 0, y: 0, r: -40, c: 45 },
              { x: 6, y: -6, r: -44, c: 42 },
              { x: -4, y: 4, r: -36, c: 36 },
              { x: 5, y: -3, r: -30, c: 22 },
              { x: 2, y: -2, r: -20, c: 8 },
              { x: 0, y: 0, r: -12, c: 0 },
            ];
        const keyframes = bobs.map((bob, i) => {
          const t = i / (bobs.length - 1 || 1);
          const x = from.x + (to.x - from.x) * t + bob.x;
          const y = from.y + (to.y - from.y) * t + bob.y;
          const scale = 0.22 + 0.78 * t;
          return {
            transform: `translate(${x - bw}px, ${y - bh}px) scale(${scale}) rotate(${bob.r}deg)`,
            clipPath: `inset(0 0 ${bob.c}% 0)`,
            opacity: 1,
            offset: t,
          };
        });
        await play(keyframes, { duration: reducedMotion ? 1 : 2200, easing: "ease-in-out", fill: "forwards" });

        const dock = center(dockAnchor);
        const endR = bobs[bobs.length - 1].r;
        await play(
          [
            { transform: `translate(${dock.x - bw}px, ${dock.y - bh}px) scale(1) rotate(${endR}deg)`, opacity: 1, offset: 0 },
            { transform: `translate(${dock.x - bw}px, ${dock.y - bh}px) scale(1.12) rotate(0deg)`, opacity: 1, offset: 0.5 },
            { transform: `translate(${dock.x - bw}px, ${dock.y - bh}px) scale(1) rotate(0deg)`, opacity: 0, offset: 1 },
          ],
          { duration: reducedMotion ? 150 : 450, easing: "ease-out", fill: "forwards" },
        );
      }

      // existence only; on failure the ocean simply stays as it was
      async function syncOcean() {
        try {
          const res = await fetch("/api/ocean", { cache: "no-store" });
          if (!res.ok) return;
          const { empty } = await res.json();
          scene.classList.toggle("has-bottles", empty === false);
        } catch {}
      }

      // Crit 9: a brief, anonymous reaction to anyone's Throw or Catch,
      // arriving over /api/events. The event carries only its type — no id,
      // message, count, or identity — so the type is the only thing this can
      // react to: thrown brightens outward, caught dims inward, neither tied
      // to any particular bottle on screen. It fires for every connected
      // browser alike, including the one whose own action caused it, so the
      // reaction lives only here: handleThrow/handleCatch never trigger it
      // directly, to avoid playing it twice for the browser that just acted.
      const PULSE_CLASSES = ["realtime-pulse-thrown", "realtime-pulse-caught"];

      function pulseOcean(kind) {
        sea.classList.remove(...PULSE_CLASSES);
        void sea.offsetWidth; // restart the animation if one is still playing
        sea.classList.add(`realtime-pulse-${kind}`);
      }

      sea.addEventListener("animationend", (event) => {
        if (event.animationName === "ocean-pulse-thrown" || event.animationName === "ocean-pulse-caught") {
          sea.classList.remove(...PULSE_CLASSES);
        }
      });

      const realtimeEvents = new EventSource("/api/events");
      realtimeEvents.addEventListener("thrown", () => {
        pulseOcean("thrown");
        syncOcean();
      });
      realtimeEvents.addEventListener("caught", () => {
        pulseOcean("caught");
        syncOcean();
      });
      // A fresh connection, or one reconnecting after a drop, may have missed
      // activity while it wasn't open. There is no backlog to replay — just
      // resync against whatever the durable ocean state actually is now.
      realtimeEvents.addEventListener("open", () => {
        syncOcean();
      });

      function pause(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      async function handleThrow() {
        const trimmed = messageEl.value.trim();
        clearFeedback();

        if (trimmed.length === 0) {
          statusEl.textContent = "Write something before you throw it.";
          return;
        }
        if (trimmed.length > MAX) {
          statusEl.textContent = "Keep it to 280 characters.";
          return;
        }

        setPending(true);
        throwBtn.textContent = "Throwing…";
        try {
          await tuckNoteIntoBottle();
          const [res] = await Promise.all([
            fetch("/api/bottles", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ message: trimmed }),
            }),
            animateBottleOut(),
          ]);
          if (res.status === 201) {
            messageEl.value = "";
            countEl.textContent = `${MAX} characters left`;
            syncOcean();
          } else {
            statusEl.textContent = "That message couldn't be thrown. Try again.";
          }
        } catch {
          statusEl.textContent = "Could not reach the ocean. Try again.";
        } finally {
          setPending(false);
          throwBtn.textContent = "Throw";
        }
      }

      async function handleCatch() {
        clearFeedback();
        setPending(true);
        catchBtn.textContent = "Catching…";
        try {
          const res = await fetch("/api/bottles/catch", { method: "POST" });
          const body = await res.json();
          if (body.bottle) {
            await animateBottleIn();
            caughtEl.textContent = body.bottle.message;
            caughtEl.classList.add("visible");
          } else {
            await pause(reducedMotion ? 150 : 700);
            emptyEl.textContent = body.message;
            emptyEl.classList.add("visible");
          }
          syncOcean();
        } catch {
          statusEl.textContent = "Could not reach the ocean. Try again.";
        } finally {
          setPending(false);
          catchBtn.textContent = "Catch";
        }
      }

      messageEl.addEventListener("input", () => {
        countEl.textContent = `${MAX - messageEl.value.length} characters left`;
        if (statusEl.textContent || caughtEl.classList.contains("visible") || emptyEl.classList.contains("visible")) {
          clearFeedback();
        }
      });

      throwBtn.addEventListener("click", handleThrow);
      catchBtn.addEventListener("click", handleCatch);
      syncOcean();
    </script>
  </body>
